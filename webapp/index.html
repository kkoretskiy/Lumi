<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Отражение</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Отражение">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000; --text:#f3f1ed; --dim:rgba(243,241,237,.55); --faint:rgba(243,241,237,.32);
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --stroke:rgba(255,255,255,.11);
  --ember:#ff5a1f; --forest:#86d957; --blush:#ff8fa3;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --vh:100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:300 16px/1.5 var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--text)}
em,.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#app{position:fixed;left:0;right:0;top:0;height:var(--vh);display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s ease}
.screen.on{opacity:1;pointer-events:auto}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(22px + env(safe-area-inset-top)) 20px 130px;max-width:520px;width:100%;margin:0 auto}
.scroll::-webkit-scrollbar{display:none}

/* ---------- главная ---------- */
.brand{padding:calc(16px + env(safe-area-inset-top)) 20px 0;text-align:center;font-size:13px;letter-spacing:.02em;color:var(--dim);font-weight:400}
.brand em{font-size:16px;color:var(--text)}
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#orb{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.voice{min-height:96px;padding:0 28px 14px;text-align:center;max-width:520px;margin:0 auto;width:100%}
#heard{font-size:13px;color:var(--faint);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:19px}
#say{font-size:21px;line-height:1.35;font-weight:300;letter-spacing:-.01em}
#say em{font-size:1.18em;color:#fff}
#say .w{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(4px);transition:opacity .6s ease,filter .6s ease,transform .6s ease;white-space:pre}
#say .w.in{opacity:1;filter:blur(0);transform:none}
#more{margin-top:8px;font-size:12px;color:var(--faint);letter-spacing:.02em;min-height:18px}
.composer{padding:0 16px 10px;max-width:520px;margin:0 auto;width:100%;transition:padding .3s}
.bar{display:flex;align-items:flex-end;gap:8px;background:var(--glass);border:1px solid var(--stroke);border-radius:26px;padding:6px 6px 6px 18px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .3s,background .3s}
.bar:focus-within{border-color:rgba(255,255,255,.22);background:var(--glass2)}
.bar textarea{flex:1;background:none;border:0;outline:none;resize:none;max-height:110px;min-height:24px;padding:9px 0;line-height:1.45;font-size:16px;font-weight:300}
.bar textarea::placeholder{color:var(--faint)}
.send{width:40px;height:40px;border-radius:50%;background:#f3f1ed;color:#000;display:grid;place-items:center;flex:none;transition:transform .2s,opacity .2s}
.send:disabled{opacity:.18;transform:scale(.92)}
.send svg{width:18px;height:18px}

/* ---------- навигация ---------- */
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;
  background:rgba(20,20,20,.55);border:1px solid var(--stroke);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:5;transition:opacity .3s,transform .3s}
nav button{width:58px;height:42px;border-radius:999px;display:grid;place-items:center;color:var(--dim);transition:background .3s,color .3s}
nav button.on{background:rgba(255,255,255,.12);color:#fff}
nav svg{width:21px;height:21px}
body.kb nav{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
#home .composer{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.kb #home .composer{padding-bottom:calc(10px + env(safe-area-inset-bottom))}

/* ---------- общие ---------- */
h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:40px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.kicker{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.06em;color:var(--dim);padding:5px 11px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass)}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember)}
.sec{margin-top:30px}
.lbl{font-size:12px;color:var(--faint);letter-spacing:.05em;margin-bottom:10px}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:22px;padding:18px}
.muted{color:var(--dim)}
.small{font-size:13px}
.pillbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:400;border:1px solid var(--stroke);background:var(--glass)}
.pillbtn.white{background:#f3f1ed;color:#000;border-color:#f3f1ed}
.pillbtn.full{width:100%}
.pillbtn.danger{color:#ff8f8f;border-color:rgba(255,120,120,.3)}

/* календарь */
.calhead{display:flex;align-items:flex-end;justify-content:space-between}
.calhead .nv{display:flex;gap:6px}
.calhead .nv button{width:36px;height:36px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass);color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;margin-top:18px}
.grid .wd{font-size:11px;color:var(--faint);text-align:center;padding-bottom:4px}
.grid .d{aspect-ratio:1;display:grid;place-items:center;position:relative;font-size:13px;color:var(--faint);border-radius:50%}
.grid .d .c{position:absolute;inset:18%;border-radius:50%;opacity:.95}
.grid .d span{position:relative;z-index:1}
.grid .d.has{color:#0b0b0b;font-weight:500;cursor:pointer}
.grid .d.today{color:#fff}
.grid .d.today:not(.has)::after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:16px;font-size:12px;color:var(--faint)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.rhythm{display:flex;gap:10px;margin-top:14px}
.rhythm div{flex:1;text-align:center;padding:14px 8px;border-radius:18px;border:1px solid var(--stroke);background:var(--glass)}
.rhythm b{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;line-height:1}
.rhythm span{font-size:11px;color:var(--faint)}
.rem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.rem:last-of-type{border-bottom:0}
.rem .t{flex:1}
.rem .t b{display:block;font-weight:400}
.rem .t span{font-size:12px;color:var(--faint)}
.rem input[type=time]{background:var(--glass2);border:1px solid var(--stroke);border-radius:12px;padding:6px 8px;color:var(--text);color-scheme:dark;font-size:14px;width:108px}
.sw{width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#bdbab4;transition:transform .3s,background .3s}
.sw.on{background:linear-gradient(90deg,#1f7a45,#86d957)}
.sw.on::after{transform:translateX(18px);background:#fff}
.field{width:100%;background:transparent;border:0;border-bottom:1px solid var(--stroke);padding:10px 0;outline:none;font-size:16px}
.field:focus{border-bottom-color:rgba(255,255,255,.4)}
.field::placeholder{color:var(--faint)}

/* профиль */
.mini{width:72px;height:72px;border-radius:50%;position:relative;overflow:hidden;filter:saturate(1.2)}
.mini::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,#ff3b1f,#ffb23f,#a6e35a,#1f7a45,#ff8fa3,#ff3b1f);animation:spin 9s linear infinite;filter:blur(10px)}
@keyframes spin{to{transform:rotate(360deg)}}
.verdict{font-family:var(--serif);font-style:italic;font-size:25px;line-height:1.3;font-weight:400}
.verdict b{font-weight:500;color:#fff}
.support{font-family:var(--serif);font-style:italic;font-size:27px;line-height:1.25;min-height:100px;transition:opacity .4s}
.quote{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;font-size:13px;border:1px solid var(--stroke);background:var(--glass);display:inline-flex;align-items:center;gap:7px}
.chip i{width:7px;height:7px;border-radius:50%}
details summary{list-style:none;cursor:pointer;color:var(--dim);font-size:14px;display:flex;align-items:center;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details[open] summary .ar{transform:rotate(180deg)}
.ar{transition:transform .3s}
.set{margin-top:16px}
.set label{font-size:12px;color:var(--faint)}

/* шторка */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;opacity:0;transition:opacity .3s}
.sheet.on{opacity:1}
.sheet .in{width:100%;max-width:520px;margin:0 auto;max-height:86vh;overflow:auto;background:#0c0c0c;border:1px solid var(--stroke);border-bottom:0;border-radius:28px 28px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .35s ease}
.sheet.on .in{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:-8px auto 16px;box-shadow:0 0 0 12px transparent;cursor:pointer}
.msg{margin:14px 0}
.msg.me{text-align:right}
.msg.me div{display:inline-block;text-align:left;background:var(--glass2);border:1px solid var(--stroke);padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:85%;white-space:pre-wrap}
.msg.orb div{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.35;max-width:92%}
.msg .tm{font-size:11px;color:var(--faint);margin-top:4px}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;padding:9px 16px;border-radius:999px;background:rgba(30,30,30,.9);border:1px solid var(--stroke);font-size:13px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <!-- ГЛАВНАЯ -->
  <section class="screen on" id="home">
    <div class="brand"><em>Отражение</em></div>
    <div id="stage"><canvas id="orb" aria-label="Шар"></canvas></div>
    <div class="voice">
      <div id="heard"></div>
      <div id="say"></div>
      <div id="more"></div>
    </div>
    <div class="composer">
      <div class="bar">
        <textarea id="inp" rows="1" placeholder="Расскажи, что внутри…" enterkeyhint="send" aria-label="Сообщение"></textarea>
        <button class="send" id="send" disabled aria-label="Отправить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </section>
  <!-- КАЛЕНДАРЬ -->
  <section class="screen" id="cal"><div class="scroll" id="calBody"></div></section>
  <!-- ПРОФИЛЬ -->
  <section class="screen" id="prof"><div class="scroll" id="profBody"></div></section>
</div>
<nav>
  <button data-go="home" class="on" aria-label="Главная"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg></button>
  <button data-go="cal" aria-label="Календарь"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></svg></button>
  <button data-go="prof" aria-label="Профиль"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg></button>
</nav>

<script>
"use strict";
/* =================== окружение =================== */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.platform && tg.platform !== "unknown");
const params = new URLSearchParams(location.search);
const BOT = (params.get("bot") || "").replace(/[^A-Za-z0-9_]/g, "");
function haptic(k){ try{ if(!inTG) return; if(k==="ok") tg.HapticFeedback.notificationOccurred("success"); else if(k==="soft") tg.HapticFeedback.impactOccurred("soft"); else tg.HapticFeedback.selectionChanged(); }catch(e){} }
if(inTG){ try{ tg.ready(); tg.expand(); tg.setHeaderColor("#000000"); tg.setBackgroundColor("#000000"); if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){} }

/* высота с учётом клавиатуры */
function fitVH(){
  const h = (inTG && tg.viewportStableHeight && tg.viewportHeight) ? tg.viewportHeight : (window.visualViewport ? visualViewport.height : innerHeight);
  document.documentElement.style.setProperty("--vh", h + "px");
  maxH = Math.max(maxH, h);
  document.body.classList.toggle("kb", h < maxH*0.78 && document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName));
}
let maxH = 0;
fitVH();
if(window.visualViewport) visualViewport.addEventListener("resize", fitVH);
addEventListener("resize", fitVH);
if(inTG) try{ tg.onEvent("viewportChanged", fitVH); }catch(e){}

/* =================== данные =================== */
const KEY = "otrazhenie.v2";
let D;
function blank(){ return { v:2, name:"", gender:"m", days:{}, rem:{evening:{on:true,t:"21:30"}, morning:{on:false,t:"08:30"}, day:{on:false,t:"14:00"}}, focus:{text:"",week:""}, ai:{url:"",key:"",model:""}, used:{} }; }
function load(){
  try{ D = JSON.parse(localStorage.getItem(KEY)); }catch(e){ D = null; }
  if(!D){ D = blank(); migrateV1(); }
  const b = blank(); for(const k in b) if(D[k]===undefined) D[k]=b[k];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }
function migrateV1(){
  try{
    const old = JSON.parse(localStorage.getItem("otrazhenie.v1")); if(!old || !old.entries) return;
    D.name = (old.settings && old.settings.name) || "";
    old.entries.forEach(e=>{
      const day = dayOf(e.date);
      Object.values(e.answers||{}).forEach(x=>{ if(x) day.msgs.push({r:"me", x, t:e.createdAt}); });
      if(e.mood) addMood(day, e.mood);
    });
    save();
  }catch(e){}
}
const pad = n => String(n).padStart(2,"0");
const dk = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dk(new Date());
function dayOf(k){ return D.days[k] || (D.days[k] = { msgs:[], mood:null, mn:0, topics:{}, cats:{} }); }
function addMood(day, m){ day.mood = day.mn ? (day.mood*day.mn + m)/(day.mn+1) : m; day.mn++; }
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_G = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const pick = a => a[Math.floor(Math.random()*a.length)];
function plural(n,a,b,c){ const m10=n%10,m100=n%100; return m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c; }
function isoWeek(d){ d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-n); const y=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return d.getUTCFullYear()+"-W"+Math.ceil(((d-y)/864e5+1)/7); }
function gx(s){ const f = D && D.gender==="f"; return String(s).replace(/([А-Яа-яЁё]+)\((а|ла)\)/g, (m,w,suf)=> f ? w+suf : w); }
function toast(t){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2300); }
load();

/* =================== собеседник =================== */
const CATS = [
  ["crisis",  /(покончить с собой|суицид|не хочу жить|не хочется жить|убить себя|самоубий|покончу|лучше бы меня не было)/, -2],
  ["selfcrit",/(я дурак|я дура|я идиот|ничего не получается|у меня ничего не|никчем|бесполезн|неудачни|ненавижу себя|я слабак|я слабая|я слабый|я ничтожеств|со мной что-то не так)/, -1.3],
  ["sad",     /(грустн|груст|печал|плохо|тоскл|тоска|одинок|плакал|плачу|пусто|апати|депресс|хреново|паршиво|не очень|тяжело|тяжёло|больно|обидн|обида)/, -1.2],
  ["anxious", /(тревож|тревог|волнуюсь|волнует|переживаю|страшно|боюсь|паник|нервнич|на нервах|беспоко|не по себе)/, -1],
  ["angry",   /(злюсь|злит|злой|злая|бесит|бесят|раздраж|взбес|достал|выбесил|ненавижу|в ярости)/, -1],
  ["tired",   /(устал|нет сил|сил нет|выгор|вымот|измот|разбит|не выспал|спать хочу|упахал|без сил|выжат)/, -0.9],
  ["fail",    /(неудач|провал|облажал|косяк|ошибся|ошиблась)/, -0.8],
  ["procr",   /(отклад|лень|ленил|прокраст|залип|протупил|ничего не делал|ничего не сделал)/, -0.5],
  ["happy",   /(хорошо|отлично|\bрад|рада\b|кайф|счастл|круто|получилось|класс|доволен|довольна|супер|прекрасн|здорово|вдохнов|удалось|\bсмог|успел|горжусь|радост|весело|легко)/, 1],
  ["grateful",/(благодар|спасибо|ценю)/, .6],
  ["calm",    /(спокойн|нормально|норм\b|ровно|тихо|умиротвор|расслаб|обычн)/, .3]
];
const TOPICS = {
  work:   [/(работ|начальн|руковод|задач|дедлайн|сверк|коллег|офис|клиент|созвон|отчет|отчёт|смен|депозитар|сделк)/, "работе", "работа"],
  people: [/(друг|друз|мам|пап|родител|семь|брат|сестр|девушк|парн|жен|муж|отношен|любим|ребен|ребён|дети)/, "людях рядом", "люди рядом"],
  body:   [/(спорт|зал|трениров|бег|пробеж|болит|болел|здоров|выспал|спал|сон|прогулк|гулял)/, "сне и движении", "движение и сон"],
  money:  [/(деньг|зарплат|долг|кредит|ипотек|финанс|траты|копить|заработ)/, "деньгах", "деньги"],
  study:  [/(учеб|учёб|универ|экзамен|курс|изуча|учусь|сесси)/, "учёбе", "учёба"],

function norm(t){
  return " " + t.toLowerCase().replace(/ё/g,"е")
    .replace(/не\s*плохо/g,"нормально").replace(/не очень хорошо|не\s*хорошо/g,"плохо")
    .replace(/не (получилось|удалось|смог|смогла|успел|успела|вышло)/g,"неудача")
    .replace(/не (рад|рада|доволен|довольна)/g,"грустно")
    .replace(/не устал/g,"нормально").replace(/не (боюсь|переживаю|волнуюсь)/g,"спокойно") + " ";
}
function analyze(text){
  const t = norm(text);
  const cats = []; let s = 0;
  CATS.forEach(([k,re,w])=>{ if(re.test(t)){ cats.push(k); s += w; } });
  const topics = Object.keys(TOPICS).filter(k=>TOPICS[k][0].test(t));
  const mood = cats.length ? Math.max(1, Math.min(5, 3 + s*1.1)) : null;
  return { cats, topics, mood, words: text.trim().split(/\s+/).length };
}
function fresh(key, arr){
  const day = today(); const u = D.used[key] && D.used[key].d===day ? D.used[key] : (D.used[key]={d:day,i:[]});
  let opts = arr.map((_,i)=>i).filter(i=>!u.i.includes(i)); if(!opts.length){ u.i=[]; opts = arr.map((_,i)=>i); }
  const i = pick(opts); u.i.push(i); return arr[i];
}
function opener(mode){
  const h = new Date().getHours(), day = D.days[today()];

  mode = mode || (h>=5&&h<12 ? "morning" : h>=12&&h<18 ? "day" : "evening");
  if(mode==="morning"){
    const f = D.focus.text && D.focus.week===isoWeek(new Date()) ? ` Фокус недели — «${D.focus.text}».` : "";

}

  if(CAT_W[main]) orb.setTarget(CAT_W[main]);

  if(/^\s*(привет|здравствуй|хай|ку|добрый|доброе)/.test(t) && a.words<=4) return "Привет. Я рядом. *Как ты сегодня?*";

  if(a.words<=2 && main==="none") return fresh("short",["Расскажи чуть подробнее — я не тороплюсь.","Я слушаю. *Что за этим стоит?*","А если одним предложением — что сейчас внутри?"]);

function summary(day){

  const mood = m==null ? "" : m>=3.8 ? "и в целом — светло" : m>=2.6 ? "и день был ровным, с перепадами" : "и было непросто";

  const sup = pick(SUPPORT[m==null||(m>=2.6&&m<3.8)?"mid":m>=3.8?"high":"low"]);

}

const bg = document.getElementById("bg"), bx = bg.getContext("2d");
let P = [], DPR = Math.min(2, window.devicePixelRatio||1);
function sizeBg(){ bg.width = innerWidth*DPR; bg.height = innerHeight*DPR;
  const n = Math.round(Math.min(160, innerWidth*innerHeight/5200));
  P = Array.from({length:n}, ()=>({ x:Math.random()*bg.width, y:Math.random()*bg.height, r:(Math.random()*1.1+.3)*DPR, a:Math.random()*.5+.08, s:(Math.random()*.12+.03)*DPR, p:Math.random()*6.28 })); }
sizeBg(); addEventListener("resize", sizeBg);
function drawBg(t){
  bx.clearRect(0,0,bg.width,bg.height);
  for(const p of P){ p.y -= p.s; p.x += Math.sin(t*.0002+p.p)*.05*DPR; if(p.y < -4){ p.y = bg.height+4; p.x = Math.random()*bg.width; }
    const a = p.a*(.6+.4*Math.sin(t*.0012+p.p)); bx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`; bx.beginPath(); bx.arc(p.x,p.y,p.r,0,6.283); bx.fill(); }
}

    base = Math.min(W, H) * .30; grain = cx.createPattern(nz, "repeat"); }

    key(){ st.energy = Math.min(1, st.energy + .22); st.tSpeed = .55; clearTimeout(this._k); this._k = setTimeout(()=>{ if(st.mode==="idle") st.tSpeed=.22; }, 1200); },
    think(){ st.mode = "think"; st.tSpeed = 1.3; },
    speak(){ st.mode = "idle"; st.tSpeed = .32; },
    word(){ st.pulse = Math.min(1, st.pulse + .45); },
    tap(){ st.pulse = 1; st.energy = .8; },
    idle(){ st.mode = "idle"; st.tSpeed = .22; }
  };
})();

const inp = document.getElementById("inp"), sendBtn = document.getElementById("send");
const sayEl = document.getElementById("say"), heardEl = document.getElementById("heard"), moreEl = document.getElementById("more");
let speaking = 0;
function fmt(s){ // *текст* → курсив
  const parts = []; s.split(/(\*[^*]+\*)/).forEach(seg=>{ if(!seg) return; const it = /^\*.*\*$/.test(seg); (it?seg.slice(1,-1):seg).split(/(\s+)/).forEach(w=>{ if(w) parts.push({w,it}); }); });
  return parts;
}
function say(text, instant){
  const id = ++speaking;
  text = gx(text);
  sayEl.innerHTML = "";
  const parts = fmt(text);
  const spans = parts.map(p=>{ if(/^\s+$/.test(p.w)) return document.createTextNode(" ");
    const s = document.createElement(p.it?"em":"span"); s.className="w"; s.textContent = p.w; sayEl.appendChild(s); return s; });
  sayEl.innerHTML = ""; spans.forEach(s=>sayEl.appendChild(s));
  orb.speak();
  const words = spans.filter(s=>s.classList);
  words.forEach((s,i)=>{ if(instant){ s.classList.add("in"); return; }
    setTimeout(()=>{ if(id!==speaking) return; s.classList.add("in"); if(i%2===0) orb.word(); }, 120 + i*95); });
  setTimeout(()=>{ if(id===speaking) orb.idle(); }, 200 + words.length*95);
}
function updateMore(){
  const day = D.days[today()]; const n = day ? day.msgs.length : 0;
  moreEl.innerHTML = n ? `<button id="openToday">разговор сегодня · ${n}</button>` : "";
  const b = document.getElementById("openToday"); if(b) b.onclick = ()=>openDay(today());

async function send(){
  const text = inp.value.trim(); if(!text) return;
  inp.value = ""; grow(); sendBtn.disabled = true;
  const day = dayOf(today());
  day.msgs.push({ r:"me", x:text, t:Date.now() }); save();
  heardEl.textContent = text; haptic("soft");
  sayEl.innerHTML = ""; orb.think();
  const local = reply(text); save();
  let out = null;
  if(D.ai.url && D.ai.key && !/^Мне очень важно/.test(local)) out = await aiReply(day);
  if(!out) await new Promise(r=>setTimeout(r, 700 + Math.random()*700));
  out = gx(out || local);
  day.msgs.push({ r:"orb", x:out, t:Date.now() }); save();
  clearTimeout(window.__moodT); if(day.mood!=null) window.__moodT = setTimeout(()=>orb.mood(day.mood), 45000);
  say(out); updateMore();
}

let supIdx = -1;
function weekStats(offset){
  const out = { days:0, msgs:0, moods:[], topics:{}, tm:{}, cats:{}, texts:[] };
  for(let i=0;i<7;i++){ const d = new Date(); d.setDate(d.getDate()-i-offset*7); const k = dk(d), day = D.days[k]; if(!day) continue;
    const me = day.msgs.filter(m=>m.r==="me"); if(!me.length) continue;
    out.days++; out.msgs += me.length; if(day.mood!=null) out.moods.push({i, m:day.mood});
    Object.entries(day.topics).forEach(([t,n])=>{ out.topics[t]=(out.topics[t]||0)+n; if(day.mood!=null){ (out.tm[t]=out.tm[t]||[]).push(day.mood); } });
    Object.entries(day.cats).forEach(([c,n])=>out.cats[c]=(out.cats[c]||0)+n);
    me.forEach(m=>out.texts.push({x:m.x, k}));
  }
  out.avg = out.moods.length ? out.moods.reduce((s,o)=>s+o.m,0)/out.moods.length : null;
  return out;
}
function verdict(w, prev){
  if(w.days===0) return { text:"Пока мы почти не говорили. <b>Возвращайся вечером</b> — через несколько разговоров здесь появится заключение о тебе.", lvl:"mid" };
  const s = [];
  s.push(`За неделю — <b>${w.days} ${plural(w.days,"день","дня","дней")}</b> разговоров.`);
  const tops = Object.entries(w.topics).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>TOPICS[k][1]);
  if(tops.length) s.push(tops.length>1 ? `Чаще всего ты говоришь о <b>${tops[0]}</b>, а ещё — о <b>${tops[1]}</b>.` : `Чаще всего ты говоришь о <b>${tops[0]}</b>.`);
  if(w.avg!=null){
    s.push(w.avg>=3.8 ? "Неделя получилась <b>светлой</b>." : w.avg>=2.6 ? "Неделя — <b>ровная</b>, с перепадами." : "Неделя была <b>непростой</b> — и ты её проживаешь.");
    if(prev.avg!=null){ const d = w.avg - prev.avg; if(d>=.4) s.push("Тебе становится <b>лучше</b>, чем неделю назад."); else if(d<=-.4) s.push("Стало <b>тяжелее</b>, чем неделю назад — это важно заметить."); }
  }
  const sc = Object.entries(w.tm).filter(([,a])=>a.length>=1).map(([t,a])=>[t,a.reduce((x,y)=>x+y,0)/a.length]).sort((a,b)=>b[1]-a[1]);
  if(w.avg!=null && sc.length>=2){
    if(sc[0][1]-w.avg>=.3) s.push(`Лучше всего тебе, когда в дне есть <b>${TOPICS[sc[0][0]][2]}</b>.`);
    const lo = sc[sc.length-1]; if(w.avg-lo[1]>=.3) s.push(`Больше всего сил забирает <b>${TOPICS[lo[0]][2]}</b>.`);
  }
  if((w.cats.tired||0)>=2) s.push("Ты часто говоришь об усталости — <b>отдых сейчас не роскошь</b>.");
  if((w.cats.selfcrit||0)>=2) s.push("Ты бываешь к себе <b>слишком строг(а)</b>.");
  return { text:s.join(" "), lvl: w.avg==null?"mid": w.avg>=3.8?"high": w.avg>=2.6?"mid":"low" };
}
function theirWords(w){
  const good = w.texts.filter(o=>o.x.length>=18 && o.x.length<=180);
  const pos = good.filter(o=>analyze(o.x).cats.some(c=>["happy","grateful","calm"].includes(c)));
  const pool = pos.length ? pos : good; if(!pool.length) return null;
  pool.sort((a,b)=>b.x.length-a.x.length); return pool[0];
}

  const copy = Object.assign({}, D, { ai: Object.assign({}, D.ai, {key:""}) });
  const json = JSON.stringify(copy), name = "otrazhenie-"+today()+".json";
  try{ const f = new File([json], name, {type:"application/json"}); if(navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f]}).catch(()=>{}); return; } }catch(e){}
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("Копия сохранена");
}
function importData(file){
  if(!file) return; const fr = new FileReader();
  fr.onload = ()=>{ try{ const x = JSON.parse(fr.result); if(!x || !x.days) throw 0; let n=0;
      Object.entries(x.days).forEach(([k,day])=>{ if(!D.days[k]){ D.days[k]=day; n++; } else { const have = new Set(D.days[k].msgs.map(m=>m.t+m.x)); day.msgs.forEach(m=>{ if(!have.has(m.t+m.x)){ D.days[k].msgs.push(m); } }); D.days[k].msgs.sort((a,b)=>a.t-b.t); } });
      if(!D.name && x.name) D.name = x.name; save(); renderProf(); updateMore(); toast("Загружено дней: "+n);
    }catch(e){ toast("Это не файл копии"); } };
  fr.readAsText(file);
}

/* =================== PWA =================== */
if("serviceWorker" in navigator && location.protocol.startsWith("http") && !inTG) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* =================== старт =================== */
(function start(){
  let mode = params.get("mode");
  try{ if(inTG && tg.initDataUnsafe && tg.initDataUnsafe.start_param) mode = tg.initDataUnsafe.start_param; }catch(e){}
  const day = D.days[today()];
  if(day && day.mood!=null) orb.mood(day.mood);
  const lastOrb = day && day.msgs.length && day.msgs[day.msgs.length-1].r==="orb" && Date.now()-day.msgs[day.msgs.length-1].t < 10*60*1000 ? day.msgs[day.msgs.length-1] : null;
  setTimeout(()=>say(lastOrb ? lastOrb.x : opener(mode)), 450);
  updateMore();
})();
</script>
